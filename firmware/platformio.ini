; Bell desk pet firmware: ESP32 + 2.8" ILI9341 (320x240, SPI).
;
;   pio run -e deskpet_ota -t upload   # update over WiFi (normal way)
;   pio run -e deskpet -t upload       # USB fallback (hold BOOT, tap EN, 57600 baud)

[platformio]
default_envs = deskpet

[env:deskpet]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM10
upload_speed = 57600
upload_flags =
	--connect-attempts
	0
	--before
	no_reset
monitor_speed = 115200
lib_deps =
	bodmer/TFT_eSPI @ ^2.5.43
	tzapu/WiFiManager @ ^2.0.17
	bblanchon/ArduinoJson @ ^7.0.4
build_flags =
	-I include
	-std=gnu++17
	-include include/User_Setup.h
	-D ILI9341_2_DRIVER
	-D SPI_FREQUENCY=20000000

; Same firmware over WiFi (OTA password is PET_OTA_PASSWORD in src/config.h).
[env:deskpet_ota]
extends = env:deskpet
upload_protocol = espota
upload_port = 192.168.137.243
upload_flags =
	--auth=deskpet
	--port=3232
